<h1>Steady Noise</h1>
<p>White, pink, and brown noise, rain, ocean waves, and a fan on Alexa. Say <i>"Alexa, open Steady Noise,"</i> then name a sound.</p>
<p>White noise is free and plays all night. Steady Noise Premium adds the other five sounds: monthly with a free week, or yearly.</p>
